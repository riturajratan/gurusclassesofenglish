<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540"><rect width="720" height="540" fill="#efdfbe"/><rect x="20" y="20" width="680" height="500" fill="none" stroke="#705733" opacity=".18"/><g fill="#705733" font-family="Georgia,serif"><text x="65" y="80" font-size="12" font-family="Arial" letter-spacing="3">THE ENGLISH NOTEBOOK</text><text x="65" y="124" font-size="12" font-family="Arial" letter-spacing="1">A WORD WORTH KEEPING</text><text x="65" y="210" font-size="70">Serendipity</text><text x="65" y="285" font-size="66"></text><text x="65" y="265" font-size="19" font-family="Arial">noun · /ˌser.ənˈdɪp.ə.ti/</text><text x="65" y="335" font-size="31">A happy discovery</text><text x="65" y="375" font-size="31">made by chance.</text><text x="65" y="461" font-size="16" font-style="italic">Good things can find you unexpectedly.</text><text x="65" y="495" font-family="Arial" font-size="11" letter-spacing="1">GURUS CLASSES OF ENGLISH</text><text x="627" y="495" font-size="27">↗</text></g></svg>