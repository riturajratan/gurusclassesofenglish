<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540"><rect width="720" height="540" fill="#dfe7d2"/><rect x="20" y="20" width="680" height="500" fill="none" stroke="#304732" opacity=".18"/><g fill="#304732" font-family="Georgia,serif"><text x="65" y="80" font-size="12" font-family="Arial" letter-spacing="3">THE ENGLISH NOTEBOOK</text><text x="65" y="124" font-size="12" font-family="Arial" letter-spacing="1">A little clarity.</text><text x="65" y="217" font-size="77">Affect<tspan x="420">Effect</tspan></text><text x="65" y="256" font-size="19" font-family="Arial">usually a verb<tspan x="420">usually a noun</tspan></text><path d="M360 150v180" stroke="#304732" opacity=".3"/><text x="65" y="303" font-size="26">to influence<tspan x="420">the result</tspan></text><text x="65" y="445" font-size="16" font-style="italic">The weather affects your mood.</text><text x="65" y="495" font-family="Arial" font-size="11" letter-spacing="1">GURUS CLASSES OF ENGLISH</text><text x="627" y="495" font-size="27">↗</text></g></svg>