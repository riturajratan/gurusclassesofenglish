name = "gurus-notebook-publisher"
main = "src/index.mjs"
compatibility_date = "2026-10-18"

[vars]
GITHUB_REPO = "riturajratan/gurusclassesofenglish"
GITHUB_BRANCH = "main"
SITE_URL = "https://gurusclassesofenglish.com"
ALLOWED_ORIGINS = "https://www.gurusclassesofenglish.com,https://gurusclassesofenglish.com"
# Set a vision-capable Responses API model in the Cloudflare dashboard.
# OPENAI_MODEL = "your-chosen-model"

[[kv_namespaces]]
binding = "DRAFTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[ratelimits]]
name = "LOGIN_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "API_LIMIT"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# Private dashboard secrets: ADMIN_PASSWORD, SESSION_SECRET, GITHUB_TOKEN,
# OPENAI_API_KEY. Never add them to this file or to frontend variables.
